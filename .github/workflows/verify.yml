name: Verify accounting foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run services
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          node --env-file=.env dist/api/main.js > /tmp/tala-api.log 2>&1 &
          npx next start apps/web > /tmp/tala-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health && curl -fsS http://localhost:3000 > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm test
      - run: npm run test:browser
      - name: Stop isolated services
        if: always()
        run: docker compose down
