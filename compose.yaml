name: tala-accounting
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: tala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tala"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.6-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:63799:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  redis-data:
